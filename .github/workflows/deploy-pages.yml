name: Deploy Ledge website

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-pages.yml
      - src/**
      - public/**
      - scripts/**
      - index.html
      - package.json
      - package-lock.json
      - vite.config.ts
      - tsconfig*.json
      - eslint.config.js
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://dhlbigmonster.github.io/ledge/' }}
      VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/ledge/' }}
      VITE_BUTTONDOWN_USERNAME: ${{ vars.VITE_BUTTONDOWN_USERNAME }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run lint && npm run build && npm run check:build

      - name: Add IndexNow ownership key when configured
        if: ${{ env.INDEXNOW_KEY != '' }}
        run: printf '%s' "$INDEXNOW_KEY" > "dist/$INDEXNOW_KEY.txt"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Submit canonical URLs to IndexNow when configured
        if: ${{ env.INDEXNOW_KEY != '' }}
        run: npm run indexnow
