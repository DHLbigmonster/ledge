name: Deploy Ledge website

# 本仓库 Pages（dhlbigmonster.github.io/ledge）自 2026-08 起只发布「跳转壳 + appcast」。
# 品牌主站在 ledgeformac/ledgeformac.github.io（由其自身仓库的 Actions 构建），
# 因此这里不再需要 vite/lint/prerender 全量构建。

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-pages.yml
      - public/appcast.xml
      - scripts/build-legacy.mjs
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build legacy redirect shell
        run: node scripts/build-legacy.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-legacy

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
